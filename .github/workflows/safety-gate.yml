name: safety-gate

# The gate runs on every push that touches firmware or safety data.
# Merging is blocked on a blocker finding. That is the entire product in
# one sentence: the conformity argument is a build artefact, not a
# quarterly document exercise.

on:
  pull_request:
    paths: ["src/**", "safety/**", "firmware/**"]
  push:
    branches: [main]

jobs:
  gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}

      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}

      - run: pip install -e ".[sign,qmc,dev]"

      # Evidence persists across runs so the chain is continuous and the
      # margin trend is comparable commit to commit.
      - uses: actions/cache@v4
        with:
          path: .evidence
          key: evidence-${{ github.ref_name }}

      - name: Validate safety data
        run: safegate validate safety/

      - name: Determine Performance Levels
        run: safegate pl safety/

      - name: Run verification campaign
        run: |
          safegate run safety/ \
            --store .evidence \
            --runner null \
            --build "$(git rev-parse HEAD)" \
            --config-hash "$(sha256sum safety/stopping_budget.yaml | cut -c1-16)" \
            --sweep 256 --falsify 128 \
            --json campaign.json

      - name: Evaluate release policy
        run: safegate gate safety/ --store .evidence --policy safety/policy.yaml

      - name: Generate technical file section
        if: always()
        run: |
          safegate report safety/ --store .evidence \
            --policy safety/policy.yaml \
            -o V-and-V.md \
            --doc-id VV-T200 --revision "${GITHUB_SHA::7}"

      - name: Verify evidence chain
        if: always()
        run: safegate verify --store .evidence

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: conformity-evidence
          path: |
            V-and-V.md
            campaign.json
