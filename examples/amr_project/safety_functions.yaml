safety_functions:
  - ref: SF-PDS-01
    name: Personnel detection and safe stop
    description: >
      Detect a person within the protective field and bring the truck to a
      standstill before contact.
    architecture: ARCH-PDS-CAT3
    requirements: [SR-COLL-001, SR-COLL-002, SR-MUTE-001]
    reaction: safe_stop
    demand_rate_per_hour: 12

  - ref: SF-SPD-01
    name: Zone speed supervision
    description: Enforce the speed limit of the occupied zone.
    architecture: ARCH-SPD-CAT2
    requirements: [SR-SPEED-001]
    reaction: safe_stop
