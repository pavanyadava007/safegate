# ISO 12100 hazard list for the T200 tow tractor (example data, fictional product).
# PLr is derived by SafeGate from S/F/P via the ISO 13849-1 Annex A risk graph;
# the comments only restate that derivation for the reader.
hazards:
  - ref: HAZ-COLL-001
    title: Collision with a person in the travel path
    description: >
      The truck travels along an aisle shared with pedestrians. A person
      steps into the travel path from the side or from behind a rack.
      Contact at operating speed can cause crushing injuries to the feet
      and lower legs, and knock-down injuries.
    zone: main_aisle
    severity: S2        # serious, normally irreversible
    frequency: F2       # continuous exposure - shared aisle
    avoidance: P2       # scarcely avoidable, person may not see the truck
    # -> PLr = e

  - ref: HAZ-COLL-002
    title: Collision during reversing at the dock
    description: >
      Reverse travel into a dock position while a person is in the dock
      area, possibly walking toward the truck.
    zone: dock
    severity: S2
    frequency: F1
    avoidance: P2
    # -> PLr = d

  - ref: HAZ-SPEED-001
    title: Overspeed in a reduced-speed zone
    description: >
      The truck enters a reduced-speed zone (blind junction, pedestrian
      crossing) above the zone limit, so the protective field no longer
      covers the stopping distance the layout was designed for.
    zone: junction
    severity: S2
    frequency: F1
    avoidance: P1
    # -> PLr = c

  - ref: HAZ-MUTE-001
    title: Protective device muted beyond its justification
    description: >
      The protective field is muted for docking at a pick station and the
      muting is not withdrawn when the justification ends.
    zone: pick_station
    severity: S2
    frequency: F1
    avoidance: P2
    # -> PLr = d
