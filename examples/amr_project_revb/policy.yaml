min_two_way_coverage: 0.50
min_robustness_margin: 0.02       # 20 mm (or 0.02 s, 0.02 m/s) of headroom, not 0
require_signed_evidence: true
high_pl_threshold: d
high_pl_min_tier: hil
# Public keys of the CI signing identity, pinned here rather than read from
# the evidence store. Empty in the example, so the gate reports the chain as
# self-attested; see docs/EVIDENCE.md for the production setup.
trusted_signers: []
disabled_rules: []
waivers:
  # The only acceptable waiver shape: scoped, justified, named.
  # "R-EXEC-002:TC-MUTE-001":
  #   justification: "HIL rig unavailable until W41; SIL evidence accepted for release candidate only"
  #   approver: "<name, role>"
