requirements:
  - ref: SR-COLL-001
    statement: >
      While moving forward, the truck shall detect a person entering its
      travel path and shall come to a standstill before contact, keeping a
      separation of at least 0.10 m to the person while it is moving.
    hazards: [HAZ-COLL-001]
    criterion_stl: "always separation_while_moving >= 0.10"
    clauses: ["EN ISO 3691-4 personnel detection", "EN ISO 13855 approach speed"]
    allocated_to: [SF-PDS-01]

  - ref: SR-COLL-002
    statement: >
      The active protective field shall at all times be at least as long as
      the stopping budget requires for the instantaneous speed: travel during
      latency, braking distance, person approach over the whole stopping
      time, device tolerance and design margin.
    hazards: [HAZ-COLL-001, HAZ-COLL-002]
    criterion_stl: "always protective_field_length >= required_field_length"
    allocated_to: [SF-PDS-01]

  - ref: SR-COLL-003
    statement: >
      While reversing, the truck shall detect a person in the rear travel
      path and come to a standstill before contact, keeping a separation of
      at least 0.10 m while it is moving.
    hazards: [HAZ-COLL-002]
    criterion_stl: "always separation_while_moving >= 0.10"
    allocated_to: [SF-PDS-01]

  - ref: SR-SPEED-001
    statement: >
      The truck shall not exceed the speed limit of the zone its leading edge
      occupies by more than 0.05 m/s.
    hazards: [HAZ-SPEED-001]
    criterion_stl: "always speed <= zone_speed_limit + 0.05"
    allocated_to: [SF-SPD-01]

  - ref: SR-MUTE-001
    statement: >
      Any muting of the personnel-detection protective device shall not
      persist longer than 2.0 s.
    hazards: [HAZ-MUTE-001]
    criterion_stl: "always muted_elapsed <= 2.0"
    allocated_to: [SF-PDS-01]
